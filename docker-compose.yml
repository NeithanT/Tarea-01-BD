# comando docker compose up para levantar el SQL server, la API yel frontend
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver2022
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong1Pass
    volumes:
      - ./backend/database/init-db.sql:/usr/src/app/initdb.sql:ro
      - ./backend/database/setup.sh:/usr/src/app/setup.sh
    entrypoint: /bin/bash /usr/src/app/setup.sh
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "127.0.0.1", "-U", "sa", "-P", "YourStrong1Pass", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: ./backend/API
      dockerfile: Dockerfile
    ports:
      - "5154:8080"
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Tarea01;User Id=sa;Password=YourStrong1Pass;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy

frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - api